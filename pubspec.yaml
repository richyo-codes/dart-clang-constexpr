name: dart_clang_constexpr
description: Typed C and C++ constant-expression evaluation using Clang.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  code_assets: ^2.0.0
  ffi: ^2.1.4
  hooks: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.26.3

flutter:
  assets:
    - lib/pcalc_clang_constexpr.js
    - lib/pcalc_clang_constexpr.wasm
    - lib/pcalc_clang_constexpr_loader.js
