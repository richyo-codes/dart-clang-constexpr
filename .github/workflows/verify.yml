name: Verify evaluator
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify ${{ matrix.target }}
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        target: [linux, wasm, android]
    env:
      LLVM_REVISION: 3394fa1fd54857c4d19a109a1ec05673050ba23a
      FLUTTER_REVISION: 76a32c1d78f4c7347da4b37fa5553abf039bdf92
      EMSDK_VERSION: 5.0.7
      BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld cmake ninja-build python3 git curl unzip xz-utils libglu1-mesa llvm-18-dev libclang-18-dev
      - name: Fetch pinned LLVM source
        run: |
          git init "$RUNNER_TEMP/llvm-source"
          git -C "$RUNNER_TEMP/llvm-source" remote add origin https://github.com/llvm/llvm-project.git
          git -C "$RUNNER_TEMP/llvm-source" fetch --depth=1 origin "$LLVM_REVISION"
          git -C "$RUNNER_TEMP/llvm-source" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/llvm-source" rev-parse HEAD)" = "$LLVM_REVISION"
          echo "LLVM_PROJECT_DIR=$RUNNER_TEMP/llvm-source" >> "$GITHUB_ENV"
      - name: Install Flutter for Dart FFI tests
        if: matrix.target == 'linux'
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter-sdk"
          git -C "$RUNNER_TEMP/flutter-sdk" checkout "$FLUTTER_REVISION"
          echo "$RUNNER_TEMP/flutter-sdk/bin" >> "$GITHUB_PATH"
      - name: Install Emscripten
        if: matrix.target == 'wasm'
        run: |
          git clone --depth=1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Install Android NDK
        if: matrix.target == 'android'
        run: |
          curl --fail --location --retry 3 https://dl.google.com/android/repository/android-ndk-r29-linux.zip -o "$RUNNER_TEMP/ndk.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r29" >> "$GITHUB_ENV"
      - name: Build and test from source
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          if [[ "$TARGET" == wasm ]]; then
            source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          fi
          bash scripts/ci_build.sh "$TARGET"
